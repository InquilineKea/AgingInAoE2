<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490"><rect width="900" height="490" fill="#101827"/><text x="35" y="40" fill="white" font-size="24">Sparse pilot: opening command rates</text><text x="35" y="65" fill="#aebbd0" font-size="15">Two games per player / period • nominal commands per minute • descriptive only</text><text x="35" y="120" fill="white" font-size="16">DauT 2011</text><rect x="190" y="100" width="190.2" height="28" rx="4" fill="#5ac8b8"/><text x="390.2" y="120" fill="white" font-size="16">47.5</text><text x="35" y="167" fill="white" font-size="16">DauT 2012</text><rect x="190" y="147" width="231.0" height="28" rx="4" fill="#5ac8b8"/><text x="431.0" y="167" fill="white" font-size="16">57.8</text><text x="35" y="214" fill="white" font-size="16">DauT 2021</text><rect x="190" y="194" width="388.4" height="28" rx="4" fill="#5ac8b8"/><text x="588.4" y="214" fill="white" font-size="16">97.1</text><text x="35" y="261" fill="white" font-size="16">DauT 2026</text><rect x="190" y="241" width="355.2" height="28" rx="4" fill="#5ac8b8"/><text x="555.2" y="261" fill="white" font-size="16">88.8</text><text x="35" y="308" fill="white" font-size="16">TheViper 2012</text><rect x="190" y="288" width="222.6" height="28" rx="4" fill="#b59afa"/><text x="422.6" y="308" fill="white" font-size="16">55.6</text><text x="35" y="355" fill="white" font-size="16">TheViper 2021</text><rect x="190" y="335" width="506.3" height="28" rx="4" fill="#b59afa"/><text x="706.3" y="355" fill="white" font-size="16">126.6</text><text x="35" y="402" fill="white" font-size="16">TheViper 2026</text><rect x="190" y="382" width="397.5" height="28" rx="4" fill="#b59afa"/><text x="597.5" y="402" fill="white" font-size="16">99.4</text><text x="35" y="465" fill="#aebbd0" font-size="14">Era, engine, map and tournament/ranked context differ. These are not reaction-time measurements.</text></svg>